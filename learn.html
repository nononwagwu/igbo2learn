<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Lesson | Igbo2Learn</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="igbo-icon.jpg" type="image/jpeg" />
</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">Igbo2Learn</div>
        <nav class="sidebar-nav">
            <a href="index.html" class="sidebar-link">
                <span class="sidebar-icon">🏠</span><span>Home</span>
            </a>
            <a href="lessons.html" class="sidebar-link active">
                <span class="sidebar-icon">📖</span><span>Learn</span>
            </a>
            <a href="quiz.html" class="sidebar-link">
                <span class="sidebar-icon">📝</span><span>Quizzes</span>
            </a>
            <a href="proverbs.html" class="sidebar-link">
                <span class="sidebar-icon">🪶</span><span>Proverbs</span>
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="lessons-main">

        <header class="lesson-header">
            <a href="lessons.html" class="flashcards-back">← Back to Lessons</a>
            <h1 id="lesson-title">Greetings</h1>
            <div class="lesson-progress-bar">
                <div class="lesson-progress-fill" id="progress-fill"></div>
            </div>
            <div class="lesson-progress-text">
                Lesson <span id="current-step">1</span> of <span id="total-steps">5</span>
            </div>
        </header>

        <div class="lesson-stage">

            <div class="lesson-card">
                <div class="lesson-word-block">
                    <h2 class="lesson-word" id="word">Ndeewo</h2>
                    <button class="flashcard-audio" id="audio-btn" aria-label="Play pronunciation">🔊</button>
                </div>
                <div class="lesson-pronunciation" id="pronunciation">(n-DEH-woh)</div>

                <div class="lesson-example">
                    <h3>Meaning</h3>
                    <p class="lesson-meaning" id="english">Hello</p>
                </div>

                <div class="lesson-tip">
                    <span class="lesson-tip-icon">💡</span>
                    <div>
                        <strong>Tip</strong>
                        <p id="tip-text">A common Igbo greeting used when meeting someone.</p>
                    </div>
                </div>
            </div>

            <div class="lesson-actions">
                <button class="flashcard-btn flashcard-btn-dontknow" id="btn-prev">← Previous</button>
                <button class="flashcard-btn flashcard-btn-know" id="btn-next">Next →</button>
            </div>

        </div>

    </main>

</div>

<script src="learn.js"></script>
</body>
</html>
